[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logreduce-cli"
version = "0.1.0"
description = "High-throughput, transactional log filtering and reduction CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "LogReduce contributors" }]
dependencies = []

[project.scripts]
logreduce = "logreduce.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
